<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="角球記錄">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1110" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>角球事件記錄</title>
<style>
/* Layout: broadcast-style scoreboard on top → full-bleed timeline band framed by hairlines → home recorder | stats | away recorder, separated by hairlines instead of boxes. Phone: scoreboard + timeline stay pinned; recorder switches between teams. */
:root{
  color-scheme:light;
  --bg:#f3f5f4; --raise:#ffffff; --tile:#e7ebe9; --tile2:#dfe4e1;
  --ink:#121815; --ink2:#46514b; --muted:#78837d; --faint:#a9b2ad; --rule:#d9dfdc;
  --home:#2356d4; --home-soft:#e2e9fb; --on-home:#ffffff;
  --away:#d2462a; --away-soft:#fbe5df; --on-away:#ffffff;
  --gold:#d9a000; --on-gold:#231900; --win:rgba(18,24,21,.06); --scrim:rgba(8,12,10,.42); --warn:#b3261e; --ok:#23784a;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang TC","Hiragino Sans TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-map:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0d1110; --raise:#171d1a; --tile:#1b2320; --tile2:#24302b;
  --ink:#e7ede9; --ink2:#b3bdb7; --muted:#859089; --faint:#55615a; --rule:#252e2a;
  --home:#7ea6ff; --home-soft:#1a2644; --on-home:#081123;
  --away:#ff8a6b; --away-soft:#3a2018; --on-away:#200b05;
  --gold:#f2b51c; --on-gold:#231900; --win:rgba(255,255,255,.06); --scrim:rgba(0,0,0,.6); --warn:#ff7166; --ok:#55bd80;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1110; --raise:#171d1a; --tile:#1b2320; --tile2:#24302b;
  --ink:#e7ede9; --ink2:#b3bdb7; --muted:#859089; --faint:#55615a; --rule:#252e2a;
  --home:#7ea6ff; --home-soft:#1a2644; --on-home:#081123;
  --away:#ff8a6b; --away-soft:#3a2018; --on-away:#200b05;
  --gold:#f2b51c; --on-gold:#231900; --win:rgba(255,255,255,.06); --scrim:rgba(0,0,0,.6); --warn:#ff7166; --ok:#55bd80;
}
html{-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:1440px;margin:0 auto;padding-bottom:28px}
.cap{font:600 11px/1 var(--f-ui);letter-spacing:.14em;color:var(--muted);margin:0}
.ghost{height:34px;padding:0 10px;border:0;background:none;border-radius:9px;font:500 14px var(--f-ui);color:var(--ink2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ghost:active{background:var(--tile)}
.ghost.warn{color:var(--warn)}
.pill{height:38px;padding:0 16px;border:0;border-radius:19px;background:var(--tile);font:600 14px var(--f-ui);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.pill:active{background:var(--tile2)}
.pill.dark{background:var(--ink);color:var(--bg)}
.pill.danger{background:var(--warn);color:#fff}
.pill:disabled{opacity:.45}
.fi{height:42px;border:0;border-radius:11px;background:var(--tile);padding:0 12px;font-size:16px;min-width:0;width:100%;color:var(--ink)}
.fi:focus{outline:2px solid var(--ink);outline-offset:0}

/* ---------- scoreboard ---------- */
.dock{background:var(--bg)}
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"lg sb nav";align-items:center;gap:6px 18px;padding-block:14px 12px}
.lgbox{grid-area:lg;min-width:0;display:grid;gap:2px}
.lg{border:0;background:none;padding:2px 0;font:600 13px var(--f-ui);letter-spacing:.06em;color:var(--ink2);width:100%;max-width:240px;border-bottom:1px solid transparent}
.lg::placeholder{color:var(--faint)}
.lg:focus{outline:none;border-bottom-color:var(--ink)}
.date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sb{grid-area:sb;display:grid;grid-template-columns:minmax(76px,190px) 44px auto 44px minmax(76px,190px);align-items:center;column-gap:12px}
.sn{display:grid;gap:1px;min-width:0}
.sn.h{justify-items:end;text-align:right}
.tn{border:0;background:none;padding:1px 0;width:100%;min-width:0;font:700 21px/1.2 var(--f-ui);border-bottom:1.5px solid transparent}
.tn::placeholder{color:var(--faint);font-weight:600}
.tn:focus{outline:none;border-bottom-color:currentColor}
.sn.h .tn{text-align:right;color:var(--home)} .sn.a .tn{color:var(--away)}
.cn{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.gs{font:600 38px/1 var(--f-num);text-align:center;font-variant-numeric:tabular-nums}
.gs.h{color:var(--home)} .gs.a{color:var(--away)}
.clockb{display:grid;grid-template-columns:auto auto;align-items:center;justify-items:center;column-gap:10px;padding:0 6px}
.per{grid-column:1/-1;border:0;background:none;padding:0 0 2px;font:600 10.5px/1 var(--f-ui);letter-spacing:.16em;color:var(--muted)}
.clk{border:0;background:none;padding:0;font:600 38px/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em;color:var(--ink);min-width:3.4em;text-align:center}
.idle .clk{color:var(--muted)}
.run{width:38px;height:38px;border-radius:50%;border:0;background:var(--ok);color:#fff;display:grid;place-items:center;padding:0}
.run.on{background:var(--tile);color:var(--ink)}
.run svg{width:13px;height:13px;fill:currentColor}
.nav{grid-area:nav;justify-self:end;display:flex;align-items:center;gap:2px}
.nav .more{font-size:18px;letter-spacing:.1em}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 0 10px;font-size:13px;color:var(--ink2);border-top:1px solid var(--rule)}
.banner b{color:var(--ink)}
.banner .sp{flex:1}

/* ---------- timeline ---------- */
.tl{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding-block:10px 4px;min-width:0}
.tl-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;color:var(--muted);flex:1 1 320px;min-width:0}
.legend span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.legend svg{width:15px;height:15px;overflow:visible;flex:none}
.legend .ld{flex-basis:100%;white-space:normal;color:var(--faint)}
.tools{display:flex;align-items:center;gap:6px;margin-left:auto}
.zoom{display:inline-flex;align-items:center;gap:0}
.zb{min-width:34px;height:30px;border:0;background:none;border-radius:8px;font:500 17px/1 var(--f-ui);color:var(--ink2);padding:0 6px}
.zb:active{background:var(--tile)}
.zb.t{font-size:12.5px;font-weight:500}
.zl{font-size:11.5px;color:var(--muted);min-width:7.5em;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.tog{display:inline-flex;gap:2px;background:var(--tile);border-radius:10px;padding:2px}
.tog button{border:0;background:none;height:28px;padding:0 12px;border-radius:8px;font-size:12.5px;color:var(--ink2)}
.tog button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lgdbtn{display:none}
.tl-wrap{position:relative;min-width:0;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:grab;margin-top:4px}
.tl-wrap.drag{cursor:grabbing}
#tl{display:block;width:100%}
#tl text{font-family:var(--f-ui)}
#tl .hl{font-family:var(--f-map)}
.ax{stroke:var(--faint);stroke-width:1.2}
.ax.st2{stroke-dasharray:4 3}
.gd{stroke:var(--rule);stroke-width:1}
.mt{stroke:var(--faint);stroke-width:1}
.tk{fill:var(--muted);font-size:10.5px;text-anchor:middle;font-variant-numeric:tabular-nums}
.tk.ht{font-weight:700;letter-spacing:.08em}
.sd{font-size:11px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
.sd.home{fill:var(--home)} .sd.away{fill:var(--away)}
.wn{fill:var(--win)}
.sg.home{fill:var(--home-soft)} .sg.away{fill:var(--away-soft)}
.sgl{font-size:10.5px;font-weight:700}
.sgl.home{fill:var(--home)} .sgl.away{fill:var(--away)}
.mo.home{fill:var(--home);opacity:.13} .mo.away{fill:var(--away);opacity:.13}
.sm{stroke-width:1.4;stroke-linecap:round}
.sm.home{stroke:var(--home)} .sm.away{stroke:var(--away)}
.sm.l0{stroke:var(--faint)} .sm.l1{opacity:.55} .sm.l2,.sm.l3,.sm.l4{stroke-width:2}
.sm.q{stroke-dasharray:2 3}
.hd.l0{fill:var(--bg);stroke:var(--faint);stroke-width:1.4}
.hd.home.l1{fill:var(--home);opacity:.8} .hd.away.l1{fill:var(--away);opacity:.8}
.hd.home.l2{fill:var(--home)} .hd.away.l2{fill:var(--away)}
.hd.l2{stroke:var(--bg);stroke-width:1.2}
.dt .hd.home.l1{fill:var(--home-soft);stroke:var(--home);stroke-width:1.4;opacity:1}
.dt .hd.away.l1{fill:var(--away-soft);stroke:var(--away);stroke-width:1.4;opacity:1}
.hl{font-size:10px;font-weight:700;text-anchor:middle}
.hl.l0{fill:var(--muted)} .hl.home.l1{fill:var(--home)} .hl.away.l1{fill:var(--away)}
.hl.home.l2{fill:var(--on-home)} .hl.away.l2{fill:var(--on-away)}
.fl{fill:var(--gold);stroke-width:1.2;stroke-linejoin:round}
.fl.home{stroke:var(--home)} .fl.away{stroke:var(--away)}
.bl{fill:var(--bg);stroke:var(--ink);stroke-width:1.5} .bc{fill:var(--ink)}
.nw{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 3;opacity:.45}
.em{fill:var(--muted);font-size:13px;text-anchor:middle}
.cards{display:flex;gap:8px;overflow-x:auto;padding:10px 0 8px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:thin}
.ecard{flex:none;width:214px;text-align:left;border:0;border-radius:12px;background:var(--tile);padding:9px 12px;display:grid;gap:3px}
.ecard .t1{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.ecard .t1 i{width:7px;height:7px;border-radius:50%;background:var(--home);flex:none}
.ecard.s1 .t1 i{background:var(--away)}
.ecard .t1 b{font-variant-numeric:tabular-nums;color:var(--ink)}
.ecard .t1 .lvl{margin-left:auto}
.ecard .t2{font:13px/1.35 var(--f-map);color:var(--ink)}
.ecard .t3{font:12px/1.35 var(--f-map);color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cards .none{color:var(--muted);font-size:12.5px;padding:4px 0}

/* level tags */
.lvl{display:inline-flex;align-items:center;font:700 11.5px/1 var(--f-ui);padding:4px 8px;border-radius:10px;white-space:nowrap;background:var(--tile2);color:var(--ink2)}
.lv0{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--rule)}
.s0 .lv1,.home .lv1{background:var(--home-soft);color:var(--home)} .s1 .lv1,.away .lv1{background:var(--away-soft);color:var(--away)}
.s0 .lv2,.home .lv2{background:var(--home);color:var(--on-home)} .s1 .lv2,.away .lv2{background:var(--away);color:var(--on-away)}
.lv3{background:var(--gold);color:var(--on-gold)}
.lv4{background:var(--ink);color:var(--bg)}

/* ---------- work area ---------- */
.rtabs{display:none}
.work{display:grid;grid-template-columns:minmax(0,1fr) 284px minmax(0,1fr);align-items:start}
.rec{min-width:0;padding:14px 22px 10px 0}
.rec.away{padding:14px 0 10px 22px}
.stats{min-width:0;padding:14px 22px 10px;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.rec-head{display:flex;align-items:center;gap:8px;min-width:0}
.rec-head i{width:9px;height:9px;border-radius:50%;background:var(--home);flex:none}
.rec.away .rec-head i{background:var(--away)}
.rec-head b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rec-head span{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rec-head em{margin-left:auto;font-style:normal;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.trail{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:12px;font:13px/1.4 var(--f-map);color:var(--ink2)}
.trail .sep{color:var(--faint)}
.trail .cu{font-style:italic}
.tchip{border:0;border-radius:11px;padding:3px 9px;font:700 12.5px/1.2 var(--f-ui);font-variant-numeric:tabular-nums;background:var(--home);color:var(--on-home)}
.away .tchip{background:var(--away);color:var(--on-away)}
.tadj{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tadj .ghost{height:30px;font-size:13px;background:var(--tile)}
.qt{font:700 18px/1.35 var(--f-map);margin-top:14px;letter-spacing:.01em}
.qs{font-size:12px;color:var(--muted);margin-top:2px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:12px}
.opt{min-height:54px;border:0;border-radius:13px;background:var(--tile);font:500 15px/1.3 var(--f-map);text-align:left;padding:8px 14px;display:flex;align-items:center;gap:8px;min-width:0;color:var(--ink)}
.home .opt:active{background:var(--home-soft)} .away .opt:active{background:var(--away-soft)}
.opt .go{margin-left:auto;color:var(--faint);font-size:18px;line-height:1}
.opt .bd{margin-left:auto;font:700 11px/1 var(--f-ui);padding:4px 7px;border-radius:9px;white-space:nowrap}
.bd.co{background:var(--gold);color:var(--on-gold)} .bd.gl{background:var(--ink);color:var(--bg)}
.opt.ex{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--rule)}
.opt .lvl{font-size:13.5px;padding:6px 10px}
.quick{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;margin-top:10px;font-size:12px;color:var(--muted)}
.quick .ghost{height:30px;font-size:13px}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:14px}
.foot .sp{flex:1}
.submit{height:46px;padding:0 28px;border-radius:23px;border:0;font-size:16px;font-weight:700}
.home .submit{background:var(--home);color:var(--on-home)} .away .submit{background:var(--away);color:var(--on-away)}
.early{height:38px;padding:0 14px;border-radius:19px;border:0;background:var(--tile);font-weight:600;font-size:13.5px}
.endv{display:grid;gap:10px;justify-items:start;margin-top:14px}
.endv .lvl{font-size:15px;padding:8px 14px;border-radius:16px}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:0;font-size:12.5px}
.txt{display:grid;gap:10px;margin-top:12px}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sugs .ghost{height:30px;font-size:13px;font-family:var(--f-map);background:var(--tile)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* ---------- stats ---------- */
.st-top{display:flex;align-items:center;gap:8px}
.st-top .sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:2px;margin-top:10px}
.chip{height:28px;padding:0 10px;border:0;border-radius:14px;background:none;font-size:12.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.st-h{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:baseline;margin-top:14px;font-size:12.5px;font-weight:700}
.st-h .h{color:var(--home);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-h .a{color:var(--away);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-h .m{color:var(--muted);font-weight:500;font-size:11px}
.secs{display:grid;gap:14px;margin-top:6px}
.sec h3{margin:0;padding:8px 0 4px;border-bottom:1px solid var(--rule)}
.srow{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:0 6px;padding:8px 0 6px}
.srow .h,.srow .a{font:600 21px/1 var(--f-num);font-variant-numeric:tabular-nums}
.srow .h{color:var(--home)} .srow .a{color:var(--away);text-align:right}
.srow .lb{text-align:center;font-size:12.5px;color:var(--ink);line-height:1.25}
.srow .lb small{display:block;font-size:10.5px;color:var(--faint)}
.srow .bar{grid-column:1/-1;height:3px;border-radius:2px;display:flex;background:var(--tile);margin-top:7px;overflow:hidden}
.srow .bar i{display:block;height:100%}
.srow .bar .bh{background:var(--home);opacity:.7} .srow .bar .ba{background:var(--away);opacity:.7;margin-left:auto}
.srow .note{grid-column:1/-1;margin:6px 0 0;font-size:11.5px;line-height:1.4;color:var(--muted);text-align:center}
.st-foot{font-size:11.5px;color:var(--muted);margin-top:12px}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.sheet-card{width:min(720px,100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--raise);border-radius:20px 20px 0 0;
  padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start}
@media (min-width:720px){.sheet{align-items:center;padding-bottom:16px}.sheet-card{border-radius:20px;max-height:calc(100vh - 32px)}}
.sh-h{display:flex;align-items:center;gap:10px}
.sh-h h3{margin:0;font-size:17px;flex:1;min-width:0}
.lbl{font-size:12px;color:var(--muted);margin-bottom:8px}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.big{height:50px;border-radius:25px;font-size:15px}
.bigclk{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.bigclk b{font:600 46px/1 var(--f-num);font-variant-numeric:tabular-nums}
.bigclk span{font-weight:700} .bigclk em{font-style:normal;color:var(--muted);font-size:13px}
.seg{display:flex;gap:2px;background:var(--tile);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;height:36px;border-radius:9px;font-size:13.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.adjrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.adjrow .ghost{background:var(--tile)}
.adjrow .fi{width:110px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.pathlist{margin:0;padding:0 0 0 20px;display:grid;gap:4px;font:14px/1.45 var(--f-map)}
.pathlist .cu{font-style:italic}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagx{font-size:12px;color:var(--muted);border-radius:9px;padding:3px 8px;background:var(--tile)}
.menu{display:grid;margin:0 -6px}

<input type="file" id="fileIn" class="vh" accept=".json,application/json,text/plain" tabindex="-1" aria-hidden="true">

<script>
(() => {
'use strict';

/* ================= 1. 思維導圖（完整版，含圖中收起的部分） =================
   打门(7)、直塞(9)、分边给边锋(113) 都已展開；數量與原圖一致。 */
const TH = 1, SH = 2, CO = 4, GL = 8, FA = 16, OK = 32;
const N = (label, kids, tag, q) => ({ label, kids: kids || null, tag: tag || 0, q: q || null });
const SHOT_OUT = [N('进球', 0, GL), N('被扑住'), N('打偏'), N('被扑出底线（角球）', 0, CO),
  N('被后卫挡住', [N('出底线（角球）', 0, CO), N('出非底线')])];
const shot = label => N(label, SHOT_OUT, SH | TH);
const TARGET = N('到达目标区域', [shot('产生射门'), N('被解围', [N('出底线（角球）', 0, CO), N('非底线')])]);
const cross = label => N(label, [N('被挡出底线（角球）', 0, CO), N('被挡出非底线'), TARGET]);
const THROUGH = [N('被断'), shot('接直塞球打门')];
const noThreat = (a, b) => N('不造威胁', [N(a), N(b)]);
const WING = [
  noThreat('被断', '回传'),
  N('造威胁', [
    cross('下底传中'), cross('平齐n形传中'), cross('平齐u形传中'), cross('四十五度传中'),
    N('下底突破', [N('被断球'), N('被挡出底线', 0, CO), N('成功突破', [
      N('传球进球门前', [N('被挡出底线（角球）', 0, CO), N('被挡出非底线'), TARGET]),
      shot('打门')])]),
    N('内切突破', [N('被断'), N('突破后无空间回传'), N('突破成功', [shot('打门'), N('直塞', THROUGH)])])
  ], TH)
];
const toWing = () => N('分边给边锋', WING);
const BOX = [noThreat('被断', '回传'), N('造威胁', [shot('打门'), N('回传')], TH), toWing(), N('直塞', THROUGH)];
const ARC = [noThreat('回传', '被断'), N('造威胁', [shot('打门')], TH), toWing(), N('直塞', THROUGH),
  N('往里传高吊球', [N('到达禁区内', [noThreat('被断', '回传'), N('造威胁', [shot('打门'), toWing(), N('回传')], TH)])])];
const LOCS = [N('边锋', WING), N('禁区内', BOX), N('弧顶', ARC)];
const RESULT = [N('成功', LOCS, OK, '禁区一圈造威胁 · 位置'), N('失败', 0, FA)];
const METHOD_NAMES = ['传控', '长传', '高压中场抢断', '后场得球反击', '得到解围球继续进攻'];
const METHOD_CH = ['传', '长', '抢', '反', '解'];
const ROOT = N('推进', METHOD_NAMES.map(m => N(m, RESULT, 0, '是否到达禁区周围一圈')), 0, '推进 · 方式');
const CUSTOM_METHOD = N('额外', RESULT, 0, '是否到达禁区周围一圈');
const SIEGE_I = '4';
const SIEGE_GAP = 180, SIEGE_MIN = 3;

function walk(path, xs){
  let node = ROOT, xi = 0, customEnd = false;
  const chain = [];
  for (let i = 0; i < path.length; i++){
    const c = path[i];
    if (c === '*'){
      chain.push({ label: (xs && xs[xi++]) || '额外', tag: 0, custom: true });
      if (node === ROOT){ node = CUSTOM_METHOD; continue; }
      node = null; customEnd = true; break;
    }
    const k = node && node.kids ? node.kids[c.charCodeAt(0) - 48] : null;
    if (!k){ node = null; break; }
    chain.push({ label: k.label, tag: k.tag });
    node = k.kids ? k : null;
    if (!node) break;
  }
  return { chain, node, customEnd };
}
const levelOf = chain => chain.reduce((L, c) =>
  Math.max(L, c.tag & GL ? 4 : c.tag & CO ? 3 : c.tag & (TH | SH) ? 2 : c.tag & OK ? 1 : c.tag & FA ? 0 : -1), -1);

const REFS = { WING, SHOT: SHOT_OUT, THROUGH };
function ser(node){
  if (!node.kids) return node.label;
  for (const k in REFS) if (node.kids === REFS[k]) return [node.label, '@' + k];
  return [node.label, ...node.kids.map(ser)];
}
const TREE_SER = { method: METHOD_NAMES, afterMethod: RESULT.map(ser),
  refs: { WING: WING.map(ser), SHOT: SHOT_OUT.map(ser), THROUGH: THROUGH.map(ser) } };
const README = '角球事件記錄匯出檔（fmt=1）。matches 是比賽陣列，每場：id、d 日期、lg 聯賽、h 主隊、a 客隊、st 狀態(1進行中/2已結束)、fs 最終比分[主,客]、fc 最終角球數[主,客]、pe 各半場結束時的比賽時鐘秒數、ev 事件陣列。'
 + '每個事件 = [t 事件發生的比賽時鐘秒數（第一次點選的時刻；下半場從2700起算）, p 半場(1上半/2下半/3加時上/4加時下), s 進攻方(0=主隊進攻客隊防守, 1=客隊進攻主隊防守), path 選擇路徑, r 結果(0推進失敗/1推進成功未造威脅/2造威脅/3角球/4進球), f 旗標(1=選到一半就提交, 2=不經推進直接記錄的角球或進球), x 「額外」輸入的文字陣列, n 備註]；後面沒有值的欄位會省略。'
 + 'path 每個字元是該層選項的序號（0起算）：第1字元對照 tree.method（推進方式），第2字元對照 tree.afterMethod（成功/失败），之後逐層對照所選節點的子節點。"*" 代表「額外」，文字依序放在 x；推進方式那一層的額外之後仍接 成功/失败，其他層的額外代表路線到此結束、結果看 r。'
 + 'tree 的節點寫成 [標籤, 子節點...]，末端只寫標籤；子節點寫成 "@名稱" 代表使用 tree.refs.名稱 這組共用分支。「下底突破→被挡出底线」算角球。';

/* ================= 2. 基本工具 ================= */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
const LEVELS = ['推進失敗', '推進成功', '造威脅', '角球', '進球'];
const PER = { 1: [0, 2700, '上半場'], 2: [2700, 5400, '下半場'], 3: [5400, 6300, '加時上'], 4: [6300, 7200, '加時下'] };
const nowSec = () => Math.floor(Date.now() / 1000);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function fmtClock(p, t){
  t = Math.max(0, Math.floor(t)); const end = PER[p][1];
  if (t > end){ const x = t - end; return `${end / 60}+${Math.floor(x / 60)}:${pad2(x % 60)}`; }
  return `${pad2(Math.floor(t / 60))}:${pad2(t % 60)}`;
}
function fmtMin(p, t){
  const E = PER[p][1];
  if (t > E + 0.5){ const x = (t - E) / 60; return `${E / 60}+${Number.isInteger(x) ? x : x.toFixed(1)}'`; }
  const m = t / 60; return `${Number.isInteger(m) ? m : m.toFixed(1)}'`;
}
const mmss = t => `${Math.floor(t / 60)}:${pad2(Math.floor(t % 60))}`;
const isStandalone = () => !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
const phoneMQ = matchMedia('(max-width: 719px)');
let evSeq = 0;
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ================= 3. 資料格式（精簡） ================= */
function prep(e){ const w = walk(e.path, e.xs); e._chain = w.chain; e._shot = w.chain.some(c => c.tag & SH); return e; }
function newMatch(prev){
  const d = new Date();
  return { id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), v: 1, c: nowSec(), u: nowSec(),
    d: `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`, lg: prev ? prev.lg : '', h: '', a: '', st: 1,
    fs: null, fc: null, pe: {}, tm: { p: 1, b: 0, r: 0, at: 0 }, events: [] };
}
const evKey = e => e.p * 100000 + e.t;
function sortEvents(m){ m.events.sort((x, y) => evKey(x) - evKey(y) || x._id - y._id); }
function encEv(e){
  const a = [e.t, e.p, e.s, e.path, e.r];
  const x = e.xs && e.xs.length ? e.xs : 0, n = e.n || '';
  if (e.fl || x || n) a.push(e.fl || 0);
  if (x || n) a.push(x);
  if (n) a.push(n);
  return a;
}
function decEv(a){
  return prep({ t: Math.max(0, +a[0] || 0), p: PER[+a[1]] ? +a[1] : 1, s: a[2] ? 1 : 0, path: String(a[3] || ''), r: Math.max(0, Math.min(4, +a[4] || 0)),
    fl: +a[5] || 0, xs: Array.isArray(a[6]) ? a[6].map(String) : [], n: a[7] ? String(a[7]) : '', _id: ++evSeq });
}
function encMatch(m, forExport){
  const o = { id: m.id, v: 1, c: m.c, u: m.u, d: m.d, lg: m.lg, h: m.h, a: m.a, st: m.st };
  if (m.fs) o.fs = m.fs; if (m.fc) o.fc = m.fc;
  if (Object.keys(m.pe).length) o.pe = m.pe;
  if (!forExport) o.tm = m.tm;
  o.ev = m.events.map(encEv);
  return o;
}
function decMatch(o){
  const m = { id: String(o.id), v: 1, c: o.c || nowSec(), u: o.u || o.c || 0, d: String(o.d || ''), lg: String(o.lg || ''), h: String(o.h || ''), a: String(o.a || ''),
    st: o.st === 1 ? 1 : 2, fs: o.fs || null, fc: o.fc || null, pe: o.pe || {}, tm: null, events: (o.ev || []).map(decEv) };
  sortEvents(m);
  if (o.tm && PER[o.tm.p]) m.tm = { p: o.tm.p, b: +o.tm.b || 0, r: o.tm.r ? 1 : 0, at: +o.tm.at || 0 };
  else { const last = m.events[m.events.length - 1]; m.tm = { p: last ? last.p : 1, b: last ? last.t : 0, r: 0, at: 0 }; }
  return m;
}
const isEmpty = m => !m.events.length && !m.lg && !m.h && !m.a && !m.tm.b && !m.tm.r;

/* ================= 4. 本機儲存（IndexedDB，失敗時改用 localStorage） ================= */
const Store = (() => {
  let db = null, mode = 'idb';
  const KEY = 'corner-log-matches';
  const lsAll = () => LS.get(KEY, {}) || {};
  const lsSave = o => { try { localStorage.setItem(KEY, JSON.stringify(o)); return true; } catch(e){ return false; } };
  function openDB(){

function clockOf(m){ const t = m.tm; return t.r ? t.b + (Date.now() - t.at) / 1000 : t.b; }

function periodInfo(m){
  const live = m.st === 1, curP = m.tm.p, clock = clockOf(m);
  let maxP = Math.max(2, curP);
  const maxT = {};
  for (const e of m.events){ maxP = Math.max(maxP, e.p); maxT[e.p] = Math.max(maxT[e.p] || 0, e.t); }
  for (const k in m.pe) if (PER[+k]) maxP = Math.max(maxP, +k);

  let off = 0;
  for (let p = 1; p <= maxP; p++){
    const [S, E] = PER[p];
    let end;
    if (p === curP) end = live ? clock : (m.pe[p] || clock);
    else if (p < curP) end = m.pe[p] || E;
    else end = S;
    if (maxT[p] != null) end = Math.max(end, maxT[p]);
    end = Math.max(end, S);
    const q = { p, S, E, end, dur: end - S, off, disp: Math.max(E - S, end - S) };
    list.push(q); by[p] = q; off += q.dur;
  }
  const cq = by[curP] || list[list.length - 1];

}
const posOf = (info, e) => { const q = info.by[e.p]; return q ? q.off + Math.max(0, e.t - q.S) : 0; };

const inWin = (info, wr, e) => wr.p ? e.p === wr.p : (posOf(info, e) >= wr.a - 0.5 && posOf(info, e) <= wr.b);

    if (e.r === 3) co++; if (e.r === 4) go++;
    if (e.fl & 2) continue;
    n++; if (e.r >= 1) s++; if (e.r >= 2) t++; ix += e.r;

function parseClock(s){

function sheetAction(a, b){
  const d = sheetData;
  switch (a){
    case 'close': closeSheet(); break;
    case 'tolist': openSheet('list'); break;
    case 'toarch': openSheet('archive'); break;
    case 'm-list': openSheet('list'); break;
    case 'm-arch': openSheet('archive'); break;
    case 'm-clock': openSheet('clock'); break;
    case 'm-end': openSheet('end'); break;
    case 'm-new': if (isEmpty(M)){ closeSheet(); showToast('目前這場還是空的，可以直接開始記錄'); } else openSheet('new'); break;
    case 'reopen': M.st = 1; touch(); saveNow(); closeSheet(); renderAll(); break;
    case 'kick': { const p = +b.dataset.p; setPeriod(M, p, PER[p][0], true); touch(); saveNow(); syncWake(); renderAll(); renderSheet(); break; }
    case 'per': { const p = +b.dataset.p; if (p !== M.tm.p){ const c = clockOf(M); const keep = c >= PER[p][0] && c <= PER[p][1] + 1200; setPeriod(M, p, keep ? c : PER[p][0], false); touch(); saveNow(); renderAll(); } renderSheet(); break; }
    case 'nudge': setClock(M, clockOf(M) + (+b.dataset.d)); touch(); saveNow(); renderAll(); renderSheet(); break;
    case 'setin': { const v = parseClock($('#shIn').value); if (v == null){ showToast('時間格式請用 分:秒，例如 63:20'); break; } setClock(M, v); touch(); saveNow(); renderAll(); renderSheet(); break; }
    case 'toggle': M.tm.r ? pauseClock(M) : startClock(M); touch(); saveNow(); syncWake(); renderAll(); renderSheet(); break;
    case 'eadj': { const e = findEv(d.id); if (e){ e.t = Math.max(0, e.t + (+b.dataset.d)); sortEvents(M); touch(); saveNow(); renderAll(); renderSheet(); } break; }
    case 'edel': if (!d.confirm){ d.confirm = true; renderSheet(); } else { removeEvent(d.id); if (d.from === 'list') openSheet('list'); else closeSheet(); showToast('已刪除事件'); } break;
    case 'open': openSheet('event', { id: +b.dataset.id, from: 'list' }); break;
    case 'exp1': { const o = b.dataset.id === M.id ? encMatch(M) : allMatches.get(b.dataset.id); if (o) openExport([o], sheetKind === 'archive' ? 'archive' : 'list'); break; }
    case 'expall': openExport([...allMatches.values()].filter(o => (o.ev && o.ev.length) || o.h || o.a), 'archive'); break;
    case 'share': doShare(); break;
    case 'dl': doDownload(); break;
    case 'copy': doCopy(); break;
    case 'imp': fileIn.click(); break;
    case 'paste': openSheet('paste'); break;
    case 'dopaste': importText($('#pasteText').value); break;
    case 'mopen': { saveNow(); const o = allMatches.get(b.dataset.id); if (o){ switchMatch(decMatch(o)); closeSheet(); renderAll(); syncWake(); showToast(`已打開：${matchTitle(M)}`); } break; }
    case 'mdel': {
      const id = b.dataset.id;
      if (d.del !== id){ d.del = id; renderSheet(); break; }
      allMatches.delete(id); Store.del(id);
      if (id === M.id){ switchMatch(newMatch(M)); renderAll(); }
      d.del = null; renderSheet(); showToast('已刪除這場比賽');
      break;
    }
    case 'doend': {
      const num = id => { const v = parseInt($('#' + id).value, 10); return isNaN(v) ? null : Math.max(0, v); };
      const fs = [num('fs0'), num('fs1')], fc = [num('fc0'), num('fc1')];

      touch(); saveNow(); syncWake(); closeSheet(); renderAll(); showToast('比賽已結束並保存到倉庫');
      break;
    }
    case 'donew': saveNow(); switchMatch(newMatch(M)); closeSheet(); renderAll(); syncWake(); break;
  }
}

function openExport(list, back){

    const a = document.createElement('a'); a.href = url; a.download = d.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    markExported(); showToast('已開始下載；如果沒有反應，請改用「複製文字」');
  } catch(e){ showToast('這裡無法下載，請改用「複製文字」'); }
}
function doCopy(){
  const ta = $('#expText');
  const fallback = () => { ta.focus(); ta.select(); try { document.execCommand('copy'); markExported(); showToast('已複製'); } catch(e){ showToast('文字已全選，請手動複製'); } };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(sheetData.text).then(() => { markExported(); showToast('已複製到剪貼簿'); }, fallback);
    else fallback();
  } catch(e){ fallback(); }
}
fileIn.addEventListener('change', async () => {
  const f = fileIn.files && fileIn.files[0]; fileIn.value = '';
  if (!f) return;
  try { importText(await f.text()); } catch(e){ showToast('讀取檔案失敗'); }
});
async function importText(txt){
  let o;
  try { o = JSON.parse(String(txt || '').trim()); } catch(e){ showToast('內容不是有效的 JSON'); return; }
  if (!o || o.fmt !== 1 || !Array.isArray(o.matches)){ showToast('這不是角球事件記錄的匯出檔'); return; }
  let add = 0, upd = 0, skip = 0;
  for (const raw of o.matches){
    if (!raw || !raw.id || !Array.isArray(raw.ev)){ skip++; continue; }
    const ex = allMatches.get(raw.id);
    if (ex && (ex.u || 0) > (raw.u || 0)){ skip++; continue; }
    const m = decMatch(raw);
    if (ex && ex.tm && raw.st === 1) m.tm = ex.tm;
    const enc = encMatch(m);
    allMatches.set(enc.id, enc); await Store.put(enc);
    ex ? upd++ : add++;
    if (enc.id === M.id){ M = decMatch(enc); ui.drafts = [null, null]; }
  }
  renderAll(); openSheet('archive');
  showToast(`匯入完成：新增 ${add} 場、更新 ${upd} 場${skip ? `、略過 ${skip} 場（倉庫裡的比較新或格式不符）` : ''}`);
}

/* ================= 13. 其他互動 ================= */
const toastEl = $('#toast'), toastMsg = $('#toastMsg'), toastUndo = $('#toastUndo');
let toastT = 0, undoFn = null;
function showToast(msg, undo){
  toastMsg.textContent = msg; undoFn = undo || null; toastUndo.hidden = !undo; toastEl.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { toastEl.hidden = true; undoFn = null; }, undo ? 6000 : 2600);
}
toastUndo.addEventListener('click', () => { const f = undoFn; undoFn = null; toastEl.hidden = true; if (f){ f(); showToast('已復原'); } });

let nameT = 0;
for (const [id, key] of fields){
  const el = $('#' + id);
  el.addEventListener('input', () => {
    M[key] = el.value; touch(); save();
    clearTimeout(nameT); nameT = setTimeout(() => { renderRec(0); renderRec(1); renderStats(); renderCards(); }, 200);
  });
}
perBtn.addEventListener('click', () => openSheet('clock'));
clkEl.addEventListener('click', () => openSheet('clock'));
runBtn.addEventListener('click', () => { M.tm.r ? pauseClock(M) : startClock(M); touch(); saveNow(); syncWake(); renderHeader(); renderRec(0); renderRec(1); renderTimeline(); renderStats(); });
$('#listBtn').addEventListener('click', () => openSheet('list'));
$('#archBtn').addEventListener('click', () => openSheet('archive'));
$('#menuBtn').addEventListener('click', () => openSheet('menu'));
$('#banner').addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  if (b.dataset.a === 'reopen'){ M.st = 1; touch(); saveNow(); renderAll(); }
  if (b.dataset.a === 'golive'){
    saveNow();
    const o = [...allMatches.values()].filter(x => x.st === 1 && x.id !== M.id).sort((a, b2) => (b2.u || 0) - (a.u || 0))[0];
    if (o){ switchMatch(decMatch(o)); renderAll(); syncWake(); }
  }
});

let lastFull = 0;
setInterval(() => {
  tickClock();
  if (sheetKind === 'clock'){ const el = $('#shClk'); if (el) el.textContent = fmtClock(M.tm.p, clockOf(M)); }
  if (M.tm.r && Date.now() - lastFull > 5000 && !tg.pts.size && !tg.inert){ lastFull = Date.now(); renderTimeline(); renderStats(); }
}, 250);

/* ================= 14. 啟動 ================= */
(async function boot(){
  renderAll();
  await Store.init();
  const arr = await Store.all();
  for (const o of arr) if (o && o.id) allMatches.set(o.id, o);
  const cur = LS.get('corner-log-current', null);
  let o = cur && allMatches.get(cur);
  if (!o) o = [...allMatches.values()].filter(x => x.st === 1).sort((a, b) => (b.u || 0) - (a.u || 0))[0];
  if (o) M = decMatch(o);
  renderAll(); syncWake();
  if (/[?&]cmtest\b/.test(location.search)) window.__cl = { get M(){ return M; }, allMatches, heads: () => tlHeads, tv, encMatch, TREE_SER, walk };
})();
})();
</script>
<script>
/* 主畫面 App：離線快取，以及在 Safari 裡提示「加入主畫面」 */
(() => {
  const secure = location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  if ('serviceWorker' in navigator && secure) addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  const hint = document.getElementById('installHint');
  let dismissed = false;
  try { dismissed = localStorage.getItem('corner-log-install-hint') === '1'; } catch(e){}
  const ios = /iP(ad|hone|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (secure && ios && navigator.standalone === false && !dismissed) hint.hidden = false;
  document.getElementById('installClose').onclick = () => { hint.hidden = true; try { localStorage.setItem('corner-log-install-hint', '1'); } catch(e){} };
})();
</script>
